<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Credy360</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f8fa;
      color: #1f2937;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 800px;
      margin: 80px auto;
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      text-align: center;
    }
    h1 {
      margin-bottom: 10px;
      color: #0f766e;
    }
    p {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-block;
      background: #0f766e;
      color: white;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
    }
    .btn:hover {
      background: #115e59;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Credy360</h1>
    <p>Welcome to Credy360. We provide simple loan application support for individuals and businesses.</p>
    <a class="btn" href="#">Apply for Loan</a>
  </div>
</body>
</html>
